# Ruff configuration (lint/format) - the QtGUI package only.
#
# Vendored / third-party code is EXCLUDED below: ../tools is the upstream ODrive
# tooling (old-style Python), ../GUI is the legacy GUI. Both are out of scope
# for linting and may be refactored separately some day; lint only what we own.
#line-length = 120

[lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE", "C"]
exclude = ["../tools", "../GUI"]

[lint.per-file-ignores]
# QAbstractItemModel overrides use the Qt-conventional mutable-looking
# defaults (QModelIndex()); B008's function-call-default rule doesn't apply.
"configtree.py" = ["B008"]
