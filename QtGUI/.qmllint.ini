# qmllint configuration for the QtGUI.
#
# `backend` is a runtime-injected context property (set via
# rootContext().setContextProperty("backend", ...) in main.py), so qmllint
# cannot statically know its type and reports every `backend.*` access as
# UnqualifiedAccess. This is a known false positive for injected backends
# (PySide6 has no runtime .qmltypes generation), not a real error. Demote the
# two contextual categories to `info` so they don't gate the check, while all
# other warnings keep their default `warning` level.

[Warnings]
UnqualifiedAccess=info
ContextProperties=info
